<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styleRegistro.css">
    
</head>
<body>
    <!-- código para inserir formulário de Registro -->
      <div class="container">
        <h1>Cadastro</h1>
        <p class="descricao">Preencha os campos abaixo para se cadastrar.</p>

        <form class="formulario" id="formCadastro">

            <div class="campo completo">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="campo">
                <label for="documento">Documento</label>
                <input
                    type="text"
                    id="documento"
                    name="documento"
                    placeholder="CPF ou outro documento"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Repita sua senha"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="campo completo">
                <label for="rua">Rua</label>
                <input
                    type="text"
                    id="rua"
                    name="rua"
                    placeholder="Nome da rua ou avenida"
                    autocomplete="address-line1"
                    required
                >
            </div>

            <div class="campo">
                <label for="numero">Número</label>
                <input
                    type="text"
                    id="numero"
                    name="numero"
                    placeholder="Nº da residência"
                    required
                >
            </div>

            <div class="campo">
                <label for="bairro">Bairro</label>
                <input
                    type="text"
                    id="bairro"
                    name="bairro"
                    placeholder="Nome do bairro"
                    required
                >
            </div>

            <div class="campo completo">
                <label for="complemento">Complemento</label>
                <input
                    type="text"
                    id="complemento"
                    name="complemento"
                    placeholder="Apartamento, bloco, referência (opcional)"
                    autocomplete="address-line2"
                >
            </div>

            <button type="submit">Cadastrar</button>

        </form>
    </div>

</body>
</html>
